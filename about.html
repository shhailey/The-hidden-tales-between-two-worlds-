
<!DOCTYPE html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* HEADER */

header {
    height: 65px;
    background: white;
    color: #080808;
    display: flex;
    align-items: center;
    padding: 0 5%;
}

.back-button {
    text-decoration: none;
    color: #080808;
    font-size: 11px;
    letter-spacing: 1px;
    border: 1px solid #888;
    border-radius: 30px;
    padding: 9px 16px;
    transition: .3s;
}

.back-button:hover {
    background: #080808;
    color: white;
}

/* MAIN */

.container {
    width: 90%;
    max-width: 900px;
    margin: 0 auto;
    padding: 70px 0;
}

.page-title {
    font-size: clamp(45px, 7vw, 75px);
    font-weight: 300;
    letter-spacing: 5px;
    margin-bottom: 15px;
}

.subtitle {
    font-size: 12px;
    color: #999;
    letter-spacing: 1px;
    line-height: 1.8;
    margin-bottom: 65px;
}

/* CONTENT SECTIONS */

.about-section {
    margin-bottom: 55px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #444;
    padding-bottom: 13px;
    margin-bottom: 25px;
}

.section-heading h2 {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 2px;
}

.section-heading span {
    font-size: 10px;
    color: #777;
    letter-spacing: 1px;
}

.section-content {
    min-height: 120px;
    background: #101010;
    border: 1px solid #292929;
    padding: 25px;
    color: #aaa;
    font-size: 12px;
    line-height: 2;
}

/* MOBILE */

@media (max-width: 650px) {
    header {
        height: 58px;
        padding: 0 15px;
    }

    .container {
        width: auto;
        margin: 0 20px;
        padding: 45px 0;
    }

    .subtitle {
        margin-bottom: 50px;
    }

    .section-heading h2 {
        font-size: 12px;
    }

    .section-content {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>
    <a href="javascript:history.back()" class="back-button">
        ← BACK
    </a>
</header>

<main class="container">

    <h1 class="page-title">ABOUT</h1>

    <p class="subtitle">
        A story about two worlds and hidden histories
    </p>

    <!-- HOW DID I COME UP WITH THIS? -->

    <section class="about-section">

        <div class="section-heading">
            <h2>HOW DID I COME UP WITH THIS?</h2>
            <span>01 / INSPIRATION</span>
        </div>

        <div class="section-content">
            By using my creativity and imagination
        </div>

    </section>

    <!-- WHY DID I COME UP WITH THIS? -->

    <section class="about-section">

        <div class="section-heading">
            <h2>WHY DID I COME UP WITH THIS?</h2>
            <span>02 / PURPOSE</span>
        </div>

        <div class="section-content">
            Because I wanted to make my dreams come true
        </div>

    </section>

</main>

</body>
</html>
