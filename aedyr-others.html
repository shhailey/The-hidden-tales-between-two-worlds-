
<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* HEADER */

header {
    height: 65px;
    background: white;
    color: #080808;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    position: relative;
}

.logo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 21px;
    letter-spacing: 2px;
    white-space: nowrap;
}

.switch {
    text-decoration: none;
    color: #080808;
    font-size: 11px;
    border: 1px solid #888;
    border-radius: 30px;
    padding: 9px 16px;
    transition: .3s;
    white-space: nowrap;
}

.switch:hover {
    background: #080808;
    color: white;
}

/* MAIN */

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
    padding: 65px 0;
}

.page-title {
    text-align: center;
    font-size: clamp(35px, 7vw, 65px);
    font-weight: 300;
    letter-spacing: 5px;
    margin-bottom: 15px;
}

.subtitle {
    text-align: center;
    color: #888;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 65px;
}

/* YIN YANG BACKGROUND YAY */

.yin-yang-section {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 420px;
    border: 1px solid #444;
    overflow: visible;
}

/* DARK SIDE */

.dark-side {
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 25px;
    border-right: 1px solid #444;
}

/* WHITE SIDE */

.light-side {
    background: #f1f1f1;
    color: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 25px;
}

/* BOX NI FINRO */

.light-box {
    background: #fff;
    border: 2px solid #080808;
    color: #080808;
}

.light-box:hover {
    background: #e5e5e5;
    border-color: #000;
    transform: translateY(-5px);
}
/* CHARACTER BOXES */

.character-box {
    width: 100%;
    max-width: 320px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px;
    transition: .3s ease;
}

.dark-box {
    background: #151515;
    border: 1px solid #555;
    color: white;
}

.dark-box:hover {
    background: #202020;
    border-color: white;
    transform: translateY(-5px);
}

.light-box {
    background: #fff;
    border: 1px solid #bbb;
    color: #080808;
}

.white-side .character-box {
    border: 2px solid ##080808;
}

.light-box:hover {
    background: #e5e5e5;
    border-color: #555;
    transform: translateY(-5px);
}

.character-number {
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 20px;
    opacity: .55;
}

.character-name {
    font-size: 27px;
    font-weight: 400;
    letter-spacing: 4px;
    margin-bottom: 12px;
}

.character-title {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: .6;
}

/* CENTER CHARACTER */

.middle-character {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    width: 210px;
    min-height: 155px;
    background: #777;
    color: white;
    border: 2px solid white;
    outline: 1px solid #555;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    transition: .3s ease;
}

.middle-character:hover {
    background: #999;
    transform: translate(-50%, -50%) scale(1.05);
}

.middle-character .character-name {
    font-size: 20px;
}

/* SYMBOL */

.symbol {
    text-align: center;
    margin: 75px 0 35px;
    color: #aaa;
    font-size: 45px;
    font-weight: 300;
}

.symbol-text {
    display: block;
    font-size: 10px;
    letter-spacing: 4px;
    margin-top: 15px;
}

/* DESCRIPTION */

.description {
    max-width: 650px;
    margin: 0 auto;
    text-align: center;
    color: #888;
    font-size: 13px;
    line-height: 1.9;
}

/* FOOTER */

.back {
    display: block;
    width: fit-content;
    margin: 65px auto 0;
    padding: 13px 25px;
    border: 1px solid #777;
    color: white;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: .3s;
}

.back:hover {
    background: white;
    color: black;
}

/* MOBILE */

@media (max-width: 650px) {

    header {
        height: 58px;
        padding: 0 12px;
    }

    .logo {
        font-size: 14px;
        letter-spacing: 1px;
    }

    .switch {
        font-size: 8px;
        padding: 8px;
    }

    .container {
        width: auto;
        margin: 0 18px;
        padding: 45px 0;
    }

    .page-title {
        letter-spacing: 3px;
    }

    .subtitle {
        font-size: 9px;
        margin-bottom: 45px;
    }

    .yin-yang-section {
        grid-template-columns: 1fr;
    }

    .dark-side,
    .light-side {
        min-height: 260px;
        padding: 25px 15px;
        border-right: none;
    }

    .dark-side {
        border-bottom: 1px solid #444;
    }

    .character-box {
        min-height: 190px;
    }

    .middle-character {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: 75%;
        min-height: 130px;
        margin: -1px auto;
        grid-row: 2;
    }

    .middle-character:hover {
        transform: scale(1.03);
    }

    .light-side {
        grid-row: 3;
    }

    .symbol {
        margin: 50px 0 25px;
    }
}
</style>
</head>

<body>

<header>
    <a href="aedyr.html" class="switch">
        ← BACK TO AEDYR
    </a>

    <div class="logo">AEDYR</div>

    <a href="aetherion.html" class="switch">
        AETHERION ↗
    </a>
</header>

<main class="container">

    <h1 class="page-title">OTHER CHARACTERS</h1>

   <section class="yin-yang-section">

    <!-- DARK SIDE -->
    <div class="dark-side">
        <div class="character-box dark-box">
            <h2 class="character-name">FINRO</h2>
        </div>
    </div>

    <!-- CENTER -->
    <div class="middle-character">
        <h2 class="character-name">LATIMORE</h2>
    </div>

    <!-- LIGHT SIDE -->
    <div class="light-side">
        <div class="character-box light-box">
            <h2 class="character-name">KAGEHARA</h2>
        </div>
    </div>

</section>

    <a href="#top" class="back">↑ BACK TO TOP</a>

</main>

</body>
</html>
